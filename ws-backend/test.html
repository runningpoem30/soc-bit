<!DOCTYPE html>
<html>
<body>
<script>
const ws = new WebSocket("ws://localhost:8080");

ws.onopen = () => {
    console.log("CONNECTED");

    setTimeout(() => {
        ws.send("hello");
    }, 2000);
};

ws.onmessage = (e) => {
    console.log("SERVER:", e.data);
};

ws.onerror = (e) => {
    console.log("ERROR:", e);
};

ws.onclose = (e) => {
    console.log("CLOSED:", e.code, e.reason);
};
</script>
</body>
</html>
